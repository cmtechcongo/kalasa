<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test fonction</title>
<style>
body{font-family:system-ui,sans-serif;padding:16px;max-width:420px;margin:auto}
button{width:100%;padding:14px;font-size:1rem;margin-top:12px}
pre{white-space:pre-wrap;word-break:break-word;background:#eee;padding:10px;border-radius:8px}
</style></head><body>
<h3>Test creer-utilisateurs-v2</h3>
<button id="go">Créer l'utilisateur de test</button>
<pre id="r">En attente…</pre>
<script type="module">
import { sb, SUPABASE_URL, SUPABASE_KEY } from './kalasa-db.js';
const r = document.getElementById('r');
document.getElementById('go').onclick = async () => {
  r.textContent = 'Envoi…';
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { r.textContent = 'Pas de session : connectez-vous d\'abord sur login.html.'; return; }
    const rep = await fetch(SUPABASE_URL + '/functions/v1/creer-utilisateurs-v2', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({
        nom_complet: 'Enseignant Test',
        identifiant: 'ens.test' + Math.floor(Math.random() * 1000),
        mot_de_passe: 'TestKalasa2026',
        role: 'enseignant',
        etablissements: ['e910c2e6-235c-42b1-8c8e-78807493c5cb']
      })
    });
    r.textContent = 'Statut ' + rep.status + '\n' + await rep.text();
  } catch (e) { r.textContent = 'Erreur : ' + (e.message || e); }
};
</script>
</body></html>
