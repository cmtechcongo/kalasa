<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KALASA — Journal d'audit</title>
<link rel="stylesheet" href="kalasa.css">
<style>
/* Styles propres à cette page uniquement */
.act{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:#8883;margin-right:6px}
.act.c{background:#16a34a;color:#fff}.act.m{background:#f59e0b;color:#fff}
.act.s{background:#dc2626;color:#fff}.act.l{background:#2563eb;color:#fff}
.it{padding:10px 0;border-bottom:1px solid #8883}.it small{display:block;opacity:.75;margin-top:3px}
.det{font-size:.82rem;opacity:.85;margin-top:4px;background:#8882;padding:6px 8px;border-radius:6px;word-break:break-word}
.warn{word-break:break-word}
</style></head><body>
<header>🎓 KALASA</header>
<nav id="nav"></nav>
<main>
  <div class="warn" id="warn"></div>
  <div class="card">
    <label>Recherche</label><input id="q" type="search" placeholder="🔍 Nom, action, cible…">
    <label>Type d'action</label>
    <select id="f"><option value="">Toutes</option>
      <option value="note">Notes</option><option value="bulletin">Bulletins</option>
      <option value="matiere">Matières</option><option value="periode">Périodes</option>
      <option value="paiement">Paiements</option><option value="frais">Frais</option>
      <option value="depense">Dépenses</option><option value="salaire">Salaires</option>
      <option value="eleve">Élèves</option><option value="classe">Classes</option>
      <option value="annee">Années</option><option value="etablissement">Établissements</option>
      <option value="personnel">Personnel</option><option value="parent">Parents</option>
      <option value="compte">Comptes</option><option value="droits">Droits</option>
      <option value="connexion">Connexions</option></select>
    <label>Établissement</label><select id="fe"></select>
    <div class="g">
      <div><label>Du</label><input type="date" id="d1"></div>
      <div><label>Au</label><input type="date" id="d2"></div>
    </div>
    <div class="acts"><button class="sec" id="bexp">⬇ Exporter (CSV)</button></div>
  </div>
  <div id="liste"></div>
  <div class="acts"><button class="sec" id="plus" style="display:none">Charger plus</button></div>
</main>

<script type="module">
import { sb, exigerSession } from './kalasa-db.js';

await exigerSession(['admin']);
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const erreur = t => { const w = $('warn'); w.innerHTML = t; w.style.display = t ? 'block' : 'none'; };
const CLS = { creation: 'c', modification: 'm', suppression: 's', connexion: 'l', paiement: 'm', note: 'm', droits: 'l', activation: 'c', verrouillage: 'l', deverrouillage: 'l', export_pdf: 'l' };
const PAGE = 50;

let ETABS = [], L = [], fini = false, tok = 0;
const nE = id => (ETABS.find(x => x.id === id) || {}).nom || '';
const court = v => { const s = (v !== null && typeof v === 'object') ? JSON.stringify(v) : String(v ?? '∅'); return s.length > 60 ? s.slice(0, 57) + '…' : s; };
const IGNORES = ['id', 'date_creation', 'etablissement_id', 'annee_id', 'classe_id', 'inscription_id', 'personnel_id', 'utilisateur_id', 'frais_id', 'parent_id', 'empreinte'];

/* Détails lisibles : modifications « champ : avant → après », sinon les principaux champs, sinon le JSON brut */
function resume(d) {
  if (d === null || d === undefined) return '';
  if (typeof d !== 'object') return String(d);
  if (d.modifie && typeof d.modifie === 'object') {
    const k = Object.keys(d.modifie);
    return k.length ? k.map(c => `${c} : ${court(d.modifie[c].avant)} → ${court(d.modifie[c].apres)}`).join(' · ') : '(donnée non affichée)';
  }
  const src = d.apres && typeof d.apres === 'object' ? d.apres : d.avant && typeof d.avant === 'object' ? d.avant : null;
  if (src) return Object.keys(src).filter(k => !IGNORES.includes(k) && src[k] !== null && src[k] !== '').slice(0, 8).map(k => `${k} : ${court(src[k])}`).join(' · ');
  return JSON.stringify(d);
}

function requete() {
  let r = sb.from('journal_audit').select('*').order('date_action', { ascending: false }).order('id', { ascending: false });
  const f = $('f').value; if (f) r = r.ilike('action', f + '.%');
  const e = $('fe').value; if (e) r = r.eq('etablissement_id', e);
  if ($('d1').value) r = r.gte('date_action', new Date($('d1').value + 'T00:00:00').toISOString());
  if ($('d2').value) r = r.lte('date_action', new Date($('d2').value + 'T23:59:59.999').toISOString());
  const t = $('q').value.trim().replace(/[,()*%"\\]/g, ' ').trim();
  if (t) r = r.or(`utilisateur_nom.ilike.%${t}%,action.ilike.%${t}%,cible.ilike.%${t}%`);
  return r;
}

async function charger(debut) {
  const t = ++tok;
  if (debut) { L = []; fini = false; }
  const { data, error } = await requete().range(L.length, L.length + PAGE - 1);
  if (t !== tok) return;
  if (error) { erreur('Lecture impossible : ' + esc(error.message)); return; }
  erreur('');
  L = L.concat(data || []);
  fini = (data || []).length < PAGE;
  rendu();
}

function rendu() {
  $('liste').innerHTML = L.length ? L.map(e => {
    const cls = CLS[String(e.action).split('.')[1]] || CLS[String(e.action).split('.')[0]] || '';
    return `<div class="card it"><span class="act ${cls}">${esc(e.action)}</span><b>${esc(e.cible)}</b>
      <small>${new Date(e.date_action).toLocaleString('fr-FR')} · ${esc(e.utilisateur_nom || 'Système')}${e.etablissement_id ? ' · 🏫 ' + esc(nE(e.etablissement_id)) : ''}</small>
      <div class="det">${esc(resume(e.details))}</div></div>`;
  }).join('') : '<p style="text-align:center;opacity:.6">Aucune entrée</p>';
  $('plus').style.display = fini || !L.length ? 'none' : 'block';
}

async function exporter() {
  const out = [];
  try {
    for (let i = 0; i < 5000; i += 1000) {
      const { data, error } = await requete().range(i, i + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) break;
    }
  } catch (x) { return erreur('Export impossible : ' + esc(x.message || x)); }
  if (!out.length) return alert('Rien à exporter');
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Utilisateur', 'Action', 'Cible', 'Établissement', 'Détail'].join(';')]
    .concat(out.map(e => [e.date_action, e.utilisateur_nom || 'Système', e.action, e.cible, nE(e.etablissement_id), resume(e.details)].map(q).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'journal_audit.csv'; a.click();
}

let minuterie = null;
$('q').addEventListener('input', () => { clearTimeout(minuterie); minuterie = setTimeout(() => charger(true), 300); });
['f', 'fe', 'd1', 'd2'].forEach(i => $(i).addEventListener('change', () => charger(true)));
$('plus').addEventListener('click', () => charger(false));
$('bexp').addEventListener('click', exporter);

const re = await sb.from('etablissements').select('id, nom').order('nom');
ETABS = re.data || [];
$('fe').innerHTML = '<option value="">Tous les établissements</option>' + ETABS.map(e => `<option value="${esc(e.id)}">${esc(e.nom)}</option>`).join('');
await charger(true);
</script>
<script type="module" src="kalasa-ui.js"></script>
</body></html>
