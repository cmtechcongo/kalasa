<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KALASA — Frais & Caisse</title>
<link rel="stylesheet" href="kalasa.css">
<style>
/* Styles propres à cette page uniquement */
.bar{height:6px;background:#8883;border-radius:3px;margin-top:8px}
.bar i{display:block;height:6px;border-radius:3px;transition:width .4s}
.tot{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:.75rem;gap:4px}
.tot b{display:block;font-size:1rem}
.rc table{width:100%;border-collapse:collapse;margin:12px 0}
.rc td{border:1px solid #000;padding:8px;color:#000}
.detail-frais .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.detail-frais .fr{border:1px solid #8883;border-radius:8px;padding:10px}
.detail-frais .fr b{display:block;font-size:1rem}
.detail-frais .fr small{opacity:.75;font-size:.75rem}
.caisse{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.caisse>div{border-radius:10px;padding:14px;font-size:.8rem}
.caisse b{display:block;font-size:1.3rem;margin-bottom:4px}
.ent{background:#16a34a22;color:#166534}.sor{background:#dc262622;color:#991b1b}.sol{background:#2563eb22;color:#1e40af}
.filtres{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
#pmatInfo{min-height:1.2em;padding:2px 4px;font-size:.8rem}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.recent button{background:#2563eb15;border:1px solid #2563eb40;color:inherit;border-radius:99px;padding:4px 10px;font-size:.75rem;min-height:0}
.recent small{opacity:.6;font-size:.7rem;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stats>div{border:1px solid #8883;border-radius:10px;padding:10px;text-align:center;font-size:.75rem}
.stats b{display:block;font-size:1.25rem;margin-bottom:2px}
.stats .ok b{color:#16a34a}.stats .mid b{color:#f59e0b}.stats .ko b{color:#dc2626}
.tl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px}
.tl th,.tl td{border-bottom:1px solid #8883;padding:6px;text-align:left}
.tl .n{text-align:right;white-space:nowrap}
.el{justify-content:space-between;gap:8px}.el small{display:block;opacity:.75;margin-top:2px}
.warn{word-break:break-word}
.tabs{flex-wrap:wrap}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<header>🎓 KALASA</header>
<nav id="nav"></nav>
<main>
<div class="warn" id="warn"></div>

<div class="card">
  <div class="g">
    <div><label>Établissement</label><select id="etab"></select></div>
    <div><label>Année scolaire</label><select id="annee"></select></div>
  </div>
  <div id="blocClasse"><label>Classe</label><select id="classe"></select></div>
</div>

<div class="tabs">
  <button id="tF" data-t="F" class="on">💲 Frais</button>
  <button id="tP" data-t="P">💵 Paiement</button>
  <button id="tS" data-t="S">📊 Situation</button>
  <button id="tD" data-t="D">🧾 Dépenses</button>
  <button id="tC" data-t="C">💼 Caisse</button>
  <button id="tR" data-t="R">👔 Salaire</button>
</div>

<!-- FRAIS -->
<section id="pF">
  <form class="card" id="fF" novalidate>
    <h2 id="tf">Nouveau frais</h2>
    <label>Libellé *</label><input id="fl" placeholder="Ex : Minerval 1er trimestre" autocomplete="off">
    <div class="g">
      <div><label>Montant *</label><input id="fm" type="number" min="0" step="any" inputmode="decimal"></div>
      <div><label>Devise</label><input id="dev" placeholder="USD, FC, EUR…"></div>
    </div>
    <label>S'applique à</label><select id="fc"></select>
    <div class="acts"><button>Enregistrer</button><button type="button" class="sec" id="fa" style="display:none">Annuler</button></div>
  </form>
  <div id="lf"></div>
</section>

<!-- PAIEMENT -->
<section id="pP" style="display:none">
  <form class="card" id="fP" novalidate>
    <h2>Enregistrer un paiement</h2>
    <label>Recherche rapide (matricule ou nom)</label>
    <input id="psearch" placeholder="Tapez un matricule ou un nom…" autocomplete="off">
    <div id="psearchInfo" style="font-size:.8rem;min-height:1.2em;padding:2px 4px"></div>
    <div id="recentBox" style="margin-top:8px"></div>
    <div class="g" style="margin-top:10px">
      <div><label>Matricule *</label><input id="pmat" placeholder="Ex : 2026-0001" autocomplete="off"></div>
      <div><label>Élève *</label><select id="pe"></select></div>
    </div>
    <div id="pmatInfo"></div>
    <label>Frais *</label><select id="pf"></select>
    <div class="g">
      <div><label>Montant *</label><input id="pm" type="number" min="0.01" step="any" inputmode="decimal"></div>
      <div><label>Date *</label><input id="pd" type="date"></div>
    </div>
    <div class="g">
      <div><label>Mode</label><select id="pmo"><option>Espèces</option><option>Mobile Money</option><option>Banque</option><option>Autre</option></select></div>
      <div><label>Référence</label><input id="pr" placeholder="N° transaction" autocomplete="off"></div>
    </div>
    <div class="acts"><button id="bpay">Enregistrer et générer le reçu</button></div>
  </form>
  <div id="hist"></div>
</section>

<!-- SITUATION -->
<section id="pS" style="display:none">
  <div class="card" id="statsClasse"></div>
  <div class="card tot" id="tot"></div>
  <div class="card detail-frais" id="detailFrais"></div>
  <div class="card">
    <h3>Liste soldés / non soldés</h3>
    <div class="filtres">
      <div><label>Classe</label><select id="lstClasse"></select></div>
      <div><label>Frais</label><select id="lstFrais"></select></div>
      <div><label>Statut</label><select id="lstStatut">
        <option value="">Tous</option><option value="S">Soldés</option><option value="P">Partiels</option><option value="I">Impayés</option></select></div>
      <div><button class="sec" type="button" id="bimpl">🖨 Imprimer</button></div>
    </div>
    <div id="lstResultat"></div>
  </div>
  <div class="card">
    <label>Filtrer la situation globale</label>
    <select id="sf"><option value="">Tous</option><option value="I">Impayés</option><option value="P">Paiements partiels</option><option value="S">Soldés</option></select>
    <div class="acts">
      <button class="sec" type="button" id="bexs">⬇ Situation (CSV)</button>
      <button class="sec" type="button" id="bexp">⬇ Paiements (CSV)</button>
      <button class="sec" type="button" id="bpds">📄 Situation (PDF)</button>
    </div>
  </div>
  <div id="ls"></div>
</section>

<!-- DÉPENSES -->
<section id="pD" style="display:none">
  <form class="card" id="fD" novalidate>
    <h2>Nouvelle dépense</h2>
    <label>Motif *</label><input id="dm" placeholder="Ex : Achat craies, facture électricité…" autocomplete="off">
    <div class="g">
      <div><label>Montant *</label><input id="dmt" type="number" min="0.01" step="any"></div>
      <div><label>Date *</label><input id="dd" type="date"></div>
    </div>
    <div class="g">
      <div><label>Compte source</label><select id="dc"></select></div>
      <div><label>Mode</label><select id="dmo"><option>Espèces</option><option>Mobile Money</option><option>Banque</option><option>Autre</option></select></div>
    </div>
    <label>Bénéficiaire / Référence</label><input id="dref" placeholder="Nom ou n° facture" autocomplete="off">
    <div class="acts"><button>Enregistrer la dépense</button></div>
  </form>
  <div class="card">
    <h3>Période</h3>
    <div class="filtres">
      <div><label>Du</label><input type="date" id="d1"></div>
      <div><label>Au</label><input type="date" id="d2"></div>
      <div><button class="sec" type="button" id="bpdd">📄 Rapport PDF</button></div>
    </div>
    <p id="totDep" style="margin-top:10px;font-weight:600"></p>
  </div>
  <div id="ld"></div>
</section>

<!-- CAISSE -->
<section id="pC" style="display:none">
  <div class="card">
    <h3>Période de caisse</h3>
    <div class="filtres">
      <div><label>Du</label><input type="date" id="c1"></div>
      <div><label>Au</label><input type="date" id="c2"></div>
      <div><button class="sec" type="button" id="bpdc">📄 Rapport de caisse (PDF)</button></div>
    </div>
  </div>
  <div class="card caisse" id="blocCaisse"></div>
  <div class="card"><h3>Détail des mouvements</h3><div id="mvtCaisse"></div></div>
</section>

<!-- SALAIRE : rempli par finance-salaire.js -->
<section id="pR" style="display:none"><p class="vide">Module salaire non installé.</p></section>
</main>
<div class="over" id="ov"></div>

<script type="module">
import { sb, exigerSession } from './kalasa-db.js';
import { esc, enteteHtml, signaturesHtml, ouvrirImpression, entetePdf, signaturesPdf } from './kalasa-doc.js';

const C = await exigerSession(['admin', 'directeur', 'secretaire', 'caissier']);
const $ = i => document.getElementById(i);
const role = C.role;

/* ===== Droits d'action ===== */
const DROITS = {
  admin: ['frais', 'paiement', 'depense', 'caisse', 'salaire', 'export'],
  directeur: ['depense', 'caisse', 'salaire', 'export'],
  caissier: ['paiement', 'depense', 'caisse', 'salaire', 'export'],
  secretaire: ['export']
};
const peut = a => (DROITS[role] || []).includes(a);

/* ===== Outils ===== */
let DEV = localStorage.getItem('kalasa_devise') || 'USD';
const fmt = n => (+n || 0).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' ' + DEV;
const fmtP = n => fmt(n).replace(/[\u202f\u00a0]/g, ' ');
const fmtD = d => d ? String(d).split('-').reverse().join('/') : '';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const nom = e => [e.nom, e.postnom, e.prenom].filter(Boolean).join(' ');
const txtSel = id => $(id)?.selectedOptions?.[0]?.text || '';
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
const inRange = (d, a, b) => (!a || d >= a) && (!b || d <= b);
const erreur = t => { const w = $('warn'); w.innerHTML = t; w.style.display = t ? 'block' : 'none'; };
const pdfDispo = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
const qrUrl = t => `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(t)}`;
function empreinte(recu, montant, date, ref) {
  let h = 0; const s = recu + '|' + montant + '|' + date + '|' + ref;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(0, 6);
}
async function toutLire(creer) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await creer().range(i, i + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
async function prochainRecu(table, prefixe, an, etab) {
  const pre = prefixe + '-' + an + '-';
  const { data, error } = await sb.from(table).select('recu').eq('etablissement_id', etab).like('recu', pre + '%').order('recu', { ascending: false }).limit(1);
  if (error) throw error;
  const n = data && data[0] ? (+String(data[0].recu).split('-').pop() || 0) : 0;
  return pre + String(n + 1).padStart(5, '0');
}
function csv(nomF, rows) {
  const t = '\ufeff' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' }));
  a.download = nomF + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ===== Données ===== */
let ETABS = [], ANNEES = [], CLASSES = [], ELEVES = [], FR = [], PA = [], DEP = [], fid = null;
let PAE = new Map(), PAEF = new Map();
const etabCourant = () => ETABS.find(x => x.id === $('etab').value) || { nom: '', adresse: '' };
const cl = id => CLASSES.find(x => x.id === id) || {};
function indexer() {
  PAE = new Map(); PAEF = new Map();
  PA.forEach(p => {
    PAE.set(p.inscription_id, (PAE.get(p.inscription_id) || 0) + +p.montant);
    const k = p.inscription_id + '|' + p.frais_id; PAEF.set(k, (PAEF.get(k) || 0) + +p.montant);
  });
}
const paidE = e => PAE.get(e.id) || 0;
const paidF = (e, f) => PAEF.get(e.id + '|' + f.id) || 0;
const fraisDe = e => FR.filter(f => !f.classe_id || f.classe_id === e.classe_id);
const dueE = e => fraisDe(e).reduce((s, f) => s + +f.montant, 0);
const statutE = e => { const d = dueE(e), p = paidE(e); return d > 0 && p >= d ? 'S' : p > 0 ? 'P' : 'I'; };
const LIB_ST = { S: '✅ Soldé', P: '🟠 Partiel', I: '🔴 Impayé' };
const classesPortee = () => CLASSES.filter(c => c.etablissement_id === $('etab').value && c.annee_id === $('annee').value)
  .sort((a, b) => String(a.nom).localeCompare(String(b.nom), 'fr', { numeric: true }));
const cid = () => $('classe').value;
const SEL = () => { const v = $('classe').value; return v === '*' ? '' : v; };
const elevesPortee = sel => ELEVES.filter(e => !sel || e.classe_id === sel);
const elevesDe = c => ELEVES.filter(e => e.classe_id === c).sort((a, b) => nom(a).localeCompare(nom(b), 'fr'));
const opts = (arr, f) => arr.map(x => `<option value="${esc(x.id)}">${esc(f(x))}</option>`).join('');

/* ===== Contexte partagé avec le module salaire ===== */
const CTX = { sb, C, $, esc, fmt, fmtP, fmtD, today, peut, txtSel, etabCourant, csv, pdfTable, afficherRecu, qrUrl, empreinte,
  prochainRecu, toutLire, erreur, SAL: [], salCharger: null, salRender: null, rCaisse: () => rCaisse(),
  etabId: () => $('etab').value, anneeId: () => $('annee').value };
window.KFIN = CTX;

/* ===== PDF avec en-tête ===== */
function pdfTable(titre, head, body, foot) {
  if (!pdfDispo()) return alert('PDF indisponible : connexion requise pour charger jsPDF.');
  const d = new window.jspdf.jsPDF();
  const y0 = entetePdf(d, etabCourant(), titre, txtSel('annee'));
  d.autoTable({ head: [head], body, foot: foot ? [foot] : undefined, startY: y0, styles: { fontSize: 8 },
    headStyles: { fillColor: [37, 99, 235] }, footStyles: { fillColor: [100, 100, 100] } });
  signaturesPdf(d, (d.lastAutoTable || {}).finalY || y0,
    [{ titre: 'Établi par', nom: C.nom_complet }, { titre: "Le chef d'établissement", nom: etabCourant().chef || '' }]);
  d.save(titre.replace(/[^\w]+/g, '_') + '.pdf');
}

/* ===== Reçu (fenêtre) : en-tête + contenu + signatures ===== */
function afficherRecu(corps, titre, texteShare) {
  const ov = $('ov');
  ov.innerHTML = `<div style="max-width:460px;margin:16px auto">
    <div class="rc" id="rcBox" style="background:#fff;color:#000;padding:16px;border-radius:12px">${corps}</div>
    <div class="acts" style="margin-top:10px"><button id="rcP">🖨 Imprimer</button><button class="sec" id="rcS">📤 Partager</button><button class="sec" id="rcF">Fermer</button></div></div>`;
  ov.style.cssText = 'display:block;position:fixed;inset:0;background:#000b;overflow:auto;z-index:100';
  $('rcF').onclick = () => { ov.style.display = 'none'; ov.innerHTML = ''; };
  $('rcP').onclick = () => ouvrirImpression($('rcBox').innerHTML, titre);
  $('rcS').onclick = () => {
    if (navigator.share) navigator.share({ title: titre, text: texteShare }).catch(() => {});
    else window.open('https://wa.me/?text=' + encodeURIComponent(texteShare), '_blank');
  };
}

/* ===== Chargement ===== */
async function init() {
  const [re, ra, rc] = await Promise.all([
    sb.from('etablissements').select('id, nom, adresse, telephone, chef').order('nom'),
    sb.from('annees_scolaires').select('id, lib, debut, active').order('debut', { ascending: false }),
    sb.from('classes').select('id, etablissement_id, annee_id, nom, option_faculte')
  ]);
  const err = re.error || ra.error || rc.error;
  if (err) return erreur('Lecture impossible : ' + esc(err.message));
  ETABS = re.data || []; ANNEES = ra.data || []; CLASSES = rc.data || [];
  $('etab').innerHTML = ETABS.map(e => `<option value="${esc(e.id)}">${esc(e.nom)}</option>`).join('');
  if (ETABS.some(e => e.id === C.etabId)) $('etab').value = C.etabId;
  $('annee').innerHTML = ANNEES.map(a => `<option value="${esc(a.id)}">${esc(a.lib)}</option>`).join('');
  let k = null; try { k = (JSON.parse(localStorage.getItem('kalasa_ctx')) || {}).annee; } catch (_) {}
  $('annee').value = ANNEES.some(a => a.id === k) ? k : ((ANNEES.find(a => a.active) || ANNEES[0] || {}).id || '');
  $('dev').value = DEV; $('pd').value = today(); $('dd').value = today();
  if (!ETABS.length || !ANNEES.length) erreur('Créez d\'abord un établissement et une année scolaire.');
  appliquerDroits(); remplirClasses();
  await chargerDonnees();
  const premier = ['F', 'P', 'S', 'D', 'C', 'R'].find(x => $('t' + x).style.display !== 'none') || 'S';
  tab(premier);
  import('./finance-salaire.js').then(m => m.init(CTX)).catch(() => {});
}
async function chargerDonnees() {
  const e = $('etab').value, a = $('annee').value;
  ELEVES = []; FR = []; PA = []; DEP = [];
  if (e && a) {
    try {
      [ELEVES, FR, PA, DEP] = await Promise.all([
        toutLire(() => sb.from('inscriptions').select('id, matricule, nom, postnom, prenom, sexe, classe_id').eq('etablissement_id', e).eq('annee_id', a).order('nom')),
        toutLire(() => sb.from('frais').select('*').eq('etablissement_id', e).eq('annee_id', a).order('date_creation')),
        toutLire(() => sb.from('paiements').select('*').eq('etablissement_id', e).eq('annee_id', a).order('date_paiement')),
        toutLire(() => sb.from('depenses').select('*').eq('etablissement_id', e).eq('annee_id', a).order('date_depense', { ascending: false }))
      ]);
      erreur('');
    } catch (x) { erreur('Lecture impossible : ' + esc(x.message || x)); }
  }
  indexer();
  if (CTX.salCharger) await CTX.salCharger();
  rendu();
}
function appliquerDroits() {
  const on = { F: peut('frais'), P: peut('paiement'), S: true, D: peut('depense'), C: peut('caisse'), R: peut('salaire') };
  Object.entries(on).forEach(([x, ok]) => { $('t' + x).style.display = ok ? '' : 'none'; if (!ok) $('p' + x).style.display = 'none'; });
}
function remplirClasses() {
  const l = classesPortee(), avant = $('classe').value;
  $('classe').innerHTML = l.length ? opts(l, c => c.nom + (c.option_faculte ? ' · ' + c.option_faculte : '')) : '<option value="">Aucune classe</option>';
  if ([...$('classe').options].some(o => o.value === avant)) $('classe').value = avant;
  optToutes($('pS').style.display !== 'none');
}
function optToutes(on) {
  const s = $('classe'), ex = s.querySelector('option[data-all]');
  if (on && !ex) { const o = document.createElement('option'); o.value = '*'; o.textContent = '🏫 Toutes les classes'; o.dataset.all = '1'; s.insertBefore(o, s.firstChild); }
  if (!on && ex) { const etait = s.value === '*'; ex.remove(); if (etait) { s.selectedIndex = 0; s.dispatchEvent(new Event('change')); } }
}
function tab(t) {
  optToutes(t === 'S');
  $('blocClasse').style.display = t === 'R' ? 'none' : '';
  ['F', 'P', 'S', 'D', 'C', 'R'].forEach(x => { $('p' + x).style.display = x === t ? 'block' : 'none'; $('t' + x).className = x === t ? 'on' : ''; });
  if (t === 'S') { rSit(); rListe(); }
  if (t === 'D') { rDepCompte(); rDep(); }
  if (t === 'C') rCaisse();
  if (t === 'P') { afficherRecents(); $('psearch').focus(); }
  if (t === 'R' && CTX.salRender) CTX.salRender();
}
function rendu() {
  $('fc').innerHTML = '<option value="">Toutes les classes de l\'établissement</option>' + opts(classesPortee(), c => c.nom + (c.option_faculte ? ' · ' + c.option_faculte : ''));
  rF(); fillPe(); rPay(); rListeFrais(); rDepCompte(); rSit(); rListe(); rDep(); rCaisse(); afficherRecents();
  if (CTX.salRender) CTX.salRender();
}

/* ===== FRAIS ===== */
async function okF(ev) {
  ev.preventDefault();
  if (!peut('frais')) return alert('Accès non autorisé.');
  const e = $('etab').value, a = $('annee').value;
  if (!e || !a) return alert('Choisissez un établissement et une année.');
  const d = { lib: $('fl').value.trim(), montant: +$('fm').value };
  if (!d.lib || !(d.montant >= 0) || $('fm').value === '') return alert('Remplissez le libellé et le montant.');
  const r = fid ? await sb.from('frais').update(d).eq('id', fid)
    : await sb.from('frais').insert({ ...d, etablissement_id: e, annee_id: a, classe_id: $('fc').value || null });
  if (r.error) return erreur('Enregistrement impossible : ' + esc(r.error.message));
  resetF(); await chargerDonnees();
}

let searchTimer = null;
function rechercheEleve(force) {
  clearTimeout(searchTimer);
  const mat = $('pmat').value.trim().toLowerCase(), txt = $('psearch').value.trim().toLowerCase();
  if (!mat && !txt) { $('pmatInfo').innerHTML = ''; $('psearchInfo').innerHTML = ''; return; }
  const run = () => {
    let e = null, exact = false, source = '';
    if (mat) {
      e = ELEVES.find(x => String(x.matricule).toLowerCase() === mat); exact = !!e;
      if (!e) e = ELEVES.find(x => String(x.matricule).toLowerCase().includes(mat));
      source = 'm';
    } else {
      const mots = txt.split(/\s+/).filter(Boolean);
      e = ELEVES.find(x => { const n = nom(x).toLowerCase(); return mots.every(m => n.includes(m)); })
        || ELEVES.find(x => nom(x).toLowerCase().split(/\s+/).some(p => p.startsWith(txt)));
      source = 'n';
    }
    const box = source === 'm' ? $('pmatInfo') : $('psearchInfo');
    if (!e) { box.innerHTML = '❌ Aucun élève trouvé'; return; }
    box.innerHTML = `${exact ? '✅' : '🔎'} ${esc(nom(e))} · ${esc(cl(e.classe_id).nom || '')}`;
    if (exact || force) selectionnerEleve(e);
  };
  if (force) run(); else searchTimer = setTimeout(run, 250);
}

function mouvements(a, b) {
  const ent = PA.filter(p => inRange(p.date_paiement, a, b)).map(p => {
    const e = ELEVES.find(x => x.id === p.inscription_id) || {}, f = FR.find(x => x.id === p.frais_id) || {};
    return { type: 'E', date: p.date_paiement, lib: (f.lib || 'Paiement') + ' — ' + nom(e), mode: p.mode, montant: +p.montant, ref: p.recu };
  });
  const sor = depensesPeriode(a, b).map(d => ({ type: 'S', date: d.date_depense, lib: d.motif, mode: d.mode, montant: +d.montant, ref: d.reference || '' }));
  const MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
  const TY = { salaire: 'Salaire', prime: 'Prime', allocation: 'Allocation', autres: 'Autres' };
  const sal = (CTX.SAL || []).filter(x => inRange(x.date_paiement, a, b)).map(x => ({ type: 'S', date: x.date_paiement,
    lib: 'Personnel — ' + TY[x.type] + ' ' + MOIS[x.mois - 1] + ' ' + x.an + ' — ' + x.nom, mode: x.mode, montant: +x.montant, ref: x.recu }));
  return ent.concat(sor, sal).sort((x, y) => y.date.localeCompare(x.date));
}
function rCaisse() {
  const m = mouvements($('c1').value, $('c2').value);
  const E = m.filter(x => x.type === 'E').reduce((s, x) => s + x.montant, 0), S = m.filter(x => x.type === 'S').reduce((s, x) => s + x.montant, 0);
  $('blocCaisse').innerHTML = `<div class="ent"><b>${fmt(E)}</b>Entrées</div><div class="sor"><b>${fmt(S)}</b>Sorties</div><div class="sol"><b>${fmt(E - S)}</b>Solde</div>`;
  $('mvtCaisse').innerHTML = m.length ? m.map(x => `<div class="card el"><div class="info"><b style="color:${x.type === 'E' ? '#16a34a' : '#dc2626'}">${x.type === 'E' ? '+' : '−'} ${fmt(x.montant)}</b> · ${esc(x.lib)}
    <small>${fmtD(x.date)} · ${esc(x.mode || '')}${x.ref ? ' · ' + esc(x.ref) : ''}</small></div></div>`).join('')
    : '<p class="vide">Aucun mouvement sur cette période</p>';
}
function pdfCaisse() {
  if (!peut('export')) return alert('Accès non autorisé.');
  const m = mouvements($('c1').value, $('c2').value);
  const E = m.filter(x => x.type === 'E').reduce((s, x) => s + x.montant, 0), S = m.filter(x => x.type === 'S').reduce((s, x) => s + x.montant, 0);
  pdfTable('Rapport de caisse', ['Date', 'Type', 'Libellé', 'Mode', 'Montant'],
    m.map(x => [x.date, x.type === 'E' ? 'Entrée' : 'Sortie', x.lib, x.mode || '', fmtP(x.montant)]), ['', '', '', 'Solde', fmtP(E - S)]);
}
