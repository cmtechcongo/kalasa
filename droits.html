<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KALASA — Droits d'accès</title>
<link rel="stylesheet" href="kalasa.css">
<style>
/* Styles propres à cette page uniquement */
/* Cette matrice a son propre défilement (.wrap) : on neutralise celui de kalasa.css pour garder en-tête et 1re colonne fixes */
main table.tbl{display:table!important;overflow:visible!important;width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px}
main table.tbl th,main table.tbl td{border:1px solid #8884!important;padding:6px 4px!important;text-align:center!important}
.tbl th:first-child,.tbl td:first-child{text-align:left!important;white-space:nowrap;background:#8882;position:sticky;left:0;z-index:1}
.tbl th{background:#8883;font-weight:600;position:sticky;top:0;z-index:2}
.tbl th:first-child{z-index:3}
.wrap{overflow:auto;max-height:70vh;border-radius:10px}
.tbl input{margin:0}
.note{font-size:.82rem;opacity:.75;margin:8px 0}
</style></head><body>
<header>🎓 KALASA</header>
<nav id="nav"></nav>
<main>
  <div class="warn" id="warn"></div>
  <div class="card">
    <h2>🔐 Matrice des droits</h2>
    <p class="note">Cochez les modules accessibles à chaque rôle. L'administrateur a toujours accès à tout. Les modifications s'appliquent à la prochaine page ouverte par chaque utilisateur.</p>
    <div class="wrap"><table class="tbl" id="t"></table></div>
    <div class="acts">
      <button id="bs" onclick="sauver()">💾 Enregistrer</button>
      <button class="sec" onclick="defaut()">↺ Par défaut</button>
    </div>
    <p id="msg" style="min-height:1.2em;font-size:.85rem;margin-top:8px"></p>
  </div>
</main>

<script type="module">
import { sb, exigerSession } from './kalasa-db.js';

const C = await exigerSession(['admin']);   // page réservée à l'administrateur
if (!C) throw new Error('Session requise');

const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mess = x => (x && x.message) || String(x);
const erreur = t => { const w = $('warn'); w.innerHTML = t; w.style.display = t ? 'block' : 'none'; };

const MODS = ['index', 'demarrage', 'etablissement', 'annee', 'classe', 'eleve', 'parent', 'personnel',
  'presence', 'note', 'horaire', 'finance', 'message', 'secretariat', 'dashboard-general',
  'utilisateurs', 'droits', 'audit', 'espace-eleve'];
const ROLES_EDIT = ['directeur', 'secretaire', 'enseignant', 'caissier', 'eleve'];   // admin : tout, non modifiable
const ROLES = { admin: 'Administrateur', directeur: 'Directeur', secretaire: 'Secrétaire', enseignant: 'Enseignant', caissier: 'Caissier', eleve: 'Élève' };
const LIB = { index: 'Accueil', demarrage: 'Démarrage', etablissement: 'Établissements', annee: 'Années',
  classe: 'Classes', eleve: 'Élèves', parent: 'Parents', personnel: 'Personnel', presence: 'Présences',
  note: 'Notes', horaire: 'Horaire', finance: 'Frais', message: 'Messages', secretariat: 'Secrétariat',
  'dashboard-general': 'Tableau de bord', utilisateurs: 'Utilisateurs', droits: 'Droits', audit: 'Audit', 'espace-eleve': 'Espace élève' };

/* Droits par défaut (rétablis par le bouton « Par défaut ») */
const DEFAUT = {
  directeur: ['index', 'demarrage', 'etablissement', 'annee', 'classe', 'eleve', 'parent', 'personnel',
    'presence', 'note', 'horaire', 'finance', 'message', 'secretariat', 'dashboard-general', 'audit'],
  secretaire: ['index', 'demarrage', 'eleve', 'classe', 'parent', 'personnel', 'presence', 'horaire', 'message', 'secretariat'],
  enseignant: ['index', 'demarrage', 'presence', 'note', 'horaire'],
  caissier: ['index', 'demarrage', 'finance', 'message'],
  eleve: ['espace-eleve']
};

let ETAT = {};

async function charger() {
  const { data, error } = await sb.from('droits_roles').select('role, module');
  if (error) throw error;
  ETAT = {};
  ROLES_EDIT.forEach(r => ETAT[r] = new Set((data || []).filter(x => x.role === r).map(x => x.module)));
}

function rendu() {
  const t = $('t');
  t.innerHTML = `<tr><th>Module</th>${ROLES_EDIT.map(r => `<th>${esc(ROLES[r])}</th>`).join('')}</tr>` +
    MODS.map(m => `<tr><td>${esc(LIB[m] || m)}</td>${ROLES_EDIT.map(r => {
      if (r === 'eleve' && m !== 'espace-eleve') return '<td><input type="checkbox" disabled title="L\'élève n\'accède qu\'à son espace"></td>';
      if (r !== 'eleve' && m === 'espace-eleve') return '<td><input type="checkbox" disabled></td>';
      return `<td><input type="checkbox" data-r="${r}" data-m="${m}" ${ETAT[r].has(m) ? 'checked' : ''}></td>`;
    }).join('')}</tr>`).join('');
  t.querySelectorAll('input[data-r]').forEach(c => c.onchange = () => {
    const r = c.dataset.r, m = c.dataset.m;
    c.checked ? ETAT[r].add(m) : ETAT[r].delete(m);
  });
}

function message(html) { $('msg').innerHTML = html; setTimeout(() => { $('msg').textContent = ''; }, 3000); }

async function enregistrer(d, action) {
  erreur('');
  const { error } = await sb.rpc('kalasa_enregistrer_droits', { p: d });
  if (error) { erreur('Enregistrement impossible : ' + esc(mess(error))); return false; }
  sb.from('journal_audit').insert({ etablissement_id: C.etabId, utilisateur_nom: C.nom_complet, action, cible: 'Matrice des droits', details: d })
    .then(() => {}, () => {});
  return true;
}

async function sauver() {
  const d = {}; ROLES_EDIT.forEach(r => d[r] = [...ETAT[r]]);
  $('bs').disabled = true;
  if (await enregistrer(d, 'droits.modification')) message('<span class="bon">✔ Droits enregistrés.</span>');
  $('bs').disabled = false;
}

async function defaut() {
  if (!confirm('Rétablir les droits par défaut ?')) return;
  if (await enregistrer(DEFAUT, 'droits.reinitialisation')) {
    ROLES_EDIT.forEach(r => ETAT[r] = new Set(DEFAUT[r] || []));
    rendu(); message('<span class="bon">✔ Droits par défaut rétablis.</span>');
  }
}

Object.assign(window, { sauver, defaut });

try { await charger(); rendu(); }
catch (x) { erreur('Lecture impossible : ' + esc(mess(x)) + ' (vérifiez que le SQL des droits a bien été exécuté)'); }
</script>
<script type="module" src="kalasa-ui.js"></script>
</body></html>
