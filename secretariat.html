<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KALASA — Secrétariat</title>
<link rel="stylesheet" href="kalasa.css">
<style>
/* Styles propres à cette page uniquement */
h3{margin:14px 0 4px;font-size:.92rem}
input,select{margin:6px 0}
.it{padding:10px 0;border-bottom:1px solid #8883}.it small{display:block;opacity:.75;margin-top:2px}
.b{display:flex;gap:8px;margin-top:6px}.b button{flex:1}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #8883;font-size:.92rem}
.ln small{display:block;opacity:.75}.r{display:flex;align-items:center;gap:8px}
.tag{font-size:.72rem;padding:3px 9px;border-radius:99px;background:#16a34a;color:#fff;white-space:nowrap}
.tag.att{background:#f59e0b}
.v{opacity:.7}.al{color:#dc2626}
@media print{
  body>main:not(.over){display:block!important}
  header,nav,#kbar,.np,input{display:none!important}
  .card{box-shadow:none}
}
</style></head><body>
<header>🎓 KALASA</header>
<nav id="nav"></nav>
<main>
  <div class="warn" id="warn"></div>
  <div class="card np"><h2>📥 Demandes d'inscription <span id="nb"></span></h2><div id="dem"></div></div>
  <div class="card"><h2>🔑 Comptes élèves</h2><small id="ctx"></small>
    <p class="v np" style="font-size:.85rem;margin:6px 0">Après validation, remettez à l'élève son <b>matricule</b> : il active son compte sur la page d'activation avec son matricule, son nom et sa date de naissance.</p>
    <input id="q" class="np" type="search" placeholder="🔍 Nom ou matricule">
    <div id="cod"></div>
    <button class="np" style="margin-top:10px;width:100%" onclick="print()">🖨 Imprimer la liste</button></div>
</main>

<script type="module">
import { sb, exigerSession } from './kalasa-db.js';

const C = await exigerSession(['admin', 'directeur', 'secretaire']);
if (!C) throw new Error('Session requise');
const ETAB = C.etabId;

/* ---------- Outils ---------- */
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mess = x => (x && x.message) || String(x);
const erreur = t => { const w = $('warn'); w.innerHTML = t; w.style.display = t ? 'block' : 'none'; };
const lire = async rq => { const { data, error } = await rq; if (error) throw error; return data || []; };
const tout = async fab => { let out = [], de = 0; for (;;) { const l = await lire(fab(de, de + 999)); out = out.concat(l); if (l.length < 1000) break; de += 1000; } return out; };
const nomP = x => [x.nom, x.postnom, x.prenom].filter(Boolean).join(' ');
const dateFr = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s || ''); };

/* ---------- État ---------- */
let ANNEES = [], CLASSES = [], DEM = [], INS = [], COMPTES = new Map(), ANNEE = '', occupe = false;
const ETAB_NOM = ((C.etablissements || []).find(e => e.id === ETAB) || {}).nom || '';
const nomA = id => (ANNEES.find(a => a.id === id) || {}).lib || '';
const nomC = id => (CLASSES.find(c => c.id === id) || {}).nom || '';

function anneeCourante() {
  let k = null; try { k = (JSON.parse(localStorage.getItem('kalasa_ctx')) || {}).annee; } catch (_) {}
  if (k && ANNEES.some(a => a.id === k)) return k;
  return (ANNEES.find(a => a.active) || ANNEES[0] || {}).id || '';
}

/* ---------- Chargement ---------- */
async function charger() {
  try {
    ANNEES = await lire(sb.from('annees_scolaires').select('id, lib, debut, active').order('debut', { ascending: false }));
    ANNEE = anneeCourante();
    const [classes, dem, ins, cpt] = await Promise.all([
      lire(sb.from('classes').select('*').eq('etablissement_id', ETAB)),
      lire(sb.from('demandes_inscription').select('*').eq('etablissement_id', ETAB).order('date_creation', { ascending: false }).limit(300)),
      ANNEE ? tout((a, b) => sb.from('inscriptions').select('*').eq('etablissement_id', ETAB).eq('annee_id', ANNEE).order('nom').order('id').range(a, b)) : Promise.resolve([]),
      lire(sb.rpc('kalasa_comptes_eleves', { p_etab: ETAB }))
    ]);
    CLASSES = classes; DEM = dem; INS = ins;
    COMPTES = new Map(cpt.map(x => [String(x.matricule || '').toLowerCase(), x.actif]));
    erreur('');
  } catch (x) {
    erreur('Lecture impossible : ' + esc(mess(x)) + ' (vérifiez que le SQL du secrétariat a bien été exécuté)');
  }
  tout_();
}

/* ---------- Demandes d'inscription ---------- */
function demandes() {
  const att = DEM.filter(d => d.statut === 'attente');
  const faits = DEM.filter(d => d.statut !== 'attente').slice(0, 8);
  $('nb').textContent = att.length ? '(' + att.length + ')' : '';
  $('dem').innerHTML = (att.length ? att.map(d => {
    const cls = CLASSES.filter(c => c.annee_id == null || c.annee_id === d.annee_id);
    return `<div class="it"><b>${esc(nomP(d))}</b>
      <small>${d.sexe === 'M' ? 'Garçon' : 'Fille'} · né(e) le ${esc(dateFr(d.date_naissance))}</small>
      <small>🏫 ${esc(ETAB_NOM)} · ${esc(nomA(d.annee_id))}${d.classe_souhaitee ? ' · souhaite : ' + esc(d.classe_souhaitee) : ''}</small>
      ${d.ecole_provenance ? `<small>Provenance : ${esc(d.ecole_provenance)}</small>` : ''}${d.telephone ? `<small>📞 ${esc(d.telephone)}</small>` : ''}
      ${cls.length ? `<select id="c${esc(d.id)}">${cls.map(c => `<option value="${esc(c.id)}">${esc(c.nom)}</option>`).join('')}</select>
        <div class="b"><button onclick="S.valider('${esc(d.id)}')">✔ Valider l'inscription</button><button class="del" onclick="S.refuser('${esc(d.id)}')">✖ Refuser</button></div>`
      : `<small class="al">Aucune classe créée pour cet établissement et cette année.</small>
        <div class="b"><button class="del" onclick="S.refuser('${esc(d.id)}')">✖ Refuser</button></div>`}</div>`;
  }).join('') : '<p class="v">Aucune demande en attente.</p>')
  + (faits.length ? '<h3>Dernières demandes traitées</h3>' + faits.map(d => {
    const actif = COMPTES.has(String(d.matricule || '').toLowerCase());
    return `<div class="ln"><span>${esc(nomP(d))}</span><small>${d.statut === 'acceptee' ? '✔ ' + esc(d.matricule || '') + (actif ? ' · compte activé' : ' · à activer') : '✖ refusée'}</small></div>`;
  }).join('') : '');
}

/* ---------- Comptes élèves ---------- */
function comptes() {
  const q = $('q').value.toLowerCase().trim();
  $('ctx').textContent = ETAB_NOM + ' · ' + nomA(ANNEE);
  const l = INS.filter(x => !q || ((x.matricule || '') + ' ' + nomP(x)).toLowerCase().includes(q));
  const vus = l.slice(0, 200);
  $('cod').innerHTML = vus.length ? vus.map(x => {
    const actif = COMPTES.has(String(x.matricule || '').toLowerCase());
    return `<div class="ln"><span><b>${esc(nomP(x))}</b><small>${esc(x.matricule)} · ${esc(nomC(x.classe_id))}</small></span>
      <span class="r">${actif ? '<span class="tag">Compte actif</span>' : '<span class="tag att">À activer</span>'}</span></div>`;
  }).join('') + (l.length > vus.length ? `<p class="v">… ${l.length - vus.length} autres : précisez la recherche.</p>` : '')
  : '<p class="v">Aucun élève pour cet établissement et cette année.</p>';
}
function tout_() { demandes(); comptes(); }

/* ---------- Actions ---------- */
window.S = {
  async valider(id) {
    if (occupe) return;
    const sel = $('c' + id);
    if (!sel || !sel.value) return alert('Choisissez une classe.');
    occupe = true;
    try {
      const { data, error } = await sb.rpc('kalasa_valider_demande', { p_demande: id, p_classe: sel.value });
      if (error) throw error;
      const lien = new URL('activation.html', location.href).href;
      alert('Inscription validée.\nMatricule : ' + data + '\n\nRemettez ce matricule à l\'élève. Il active son compte sur :\n' + lien + '\navec son matricule, son nom et sa date de naissance.');
      await charger();
    } catch (x) { alert('Validation impossible : ' + mess(x)); }
    occupe = false;
  },
  async refuser(id) {
    if (occupe || !confirm('Refuser cette demande ?')) return;
    occupe = true;
    try {
      const { error } = await sb.from('demandes_inscription')
        .update({ statut: 'refusee', date_traitement: new Date().toISOString() }).eq('id', id).eq('statut', 'attente');
      if (error) throw error;
      await charger();
    } catch (x) { alert('Refus impossible : ' + mess(x)); }
    occupe = false;
  }
};

$('q').addEventListener('input', comptes);
addEventListener('kalasa:ctx', charger);
await charger();
</script>
<script type="module" src="kalasa-ui.js"></script>
</body></html>
